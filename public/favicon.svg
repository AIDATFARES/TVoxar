<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow-fx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d1527" stroke="url(#fav-grad)" stroke-width="2" />
  
  <!-- Mini Antennas -->
  <path d="M22 10 L16 4" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M42 10 L48 4" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Play Wave -->
  <path d="M25 21 L43 32 L25 43 Z" fill="url(#fav-grad)" filter="url(#glow-fx)" />
  
  <!-- Streaming arcs -->
  <path d="M46 24 C49 28 49 36 46 40" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Dot -->
  <circle cx="32" cy="52" r="2.5" fill="#00e5ff" />
</svg>
