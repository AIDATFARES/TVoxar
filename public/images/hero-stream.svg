<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="sports-banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="hero-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind TV -->
  <ellipse cx="400" cy="230" rx="360" ry="200" fill="url(#hero-glow)" />

  <!-- Television Frame -->
  <rect x="70" y="40" width="660" height="390" rx="20" fill="#0b1120" stroke="#334155" stroke-width="4" />
  
  <!-- Stand -->
  <polygon points="350,430 450,430 470,470 330,470" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="280" y="470" width="240" height="12" rx="6" fill="#334155" />

  <!-- TV Screen Inner Area -->
  <rect x="85" y="55" width="630" height="360" rx="12" fill="url(#bg-screen)" />

  <!-- Top Player Status Bar -->
  <rect x="85" y="55" width="630" height="42" fill="#090d16" opacity="0.9" />
  <!-- Logo inside TV -->
  <circle cx="115" cy="76" r="12" fill="url(#glow-cyan-blue)" />
  <polygon points="112,71 121,76 112,81" fill="#ffffff" />
  <text x="135" y="81" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">TVOXAR</text>
  <text x="195" y="81" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#38bdf8">ULTRA HD LIVE</text>

  <!-- Live Status & Resolution Pill -->
  <rect x="620" y="65" width="80" height="22" rx="11" fill="#ef4444" opacity="0.9" />
  <circle cx="633" cy="76" r="4" fill="#ffffff" />
  <text x="643" y="80" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#ffffff">LIVE 4K</text>

  <!-- Center Content: Sports & Cinema Stage -->
  <g transform="translate(110, 115)">
    <!-- Main Big Card: Premier League / Champions Match -->
    <rect x="0" y="0" width="360" height="210" rx="12" fill="#131e36" stroke="#2563eb" stroke-width="1.5" />
    <rect x="15" y="15" width="85" height="22" rx="4" fill="url(#sports-banner)" />
    <text x="24" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff">MATCHDAY</text>
    
    <!-- Team Matchup Mockup -->
    <text x="20" y="70" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#ffffff">WORLD DERBY</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#94a3b8">UEFA Champions League • Live in 4K HDR</text>
    
    <g transform="translate(20, 120)">
      <circle cx="25" cy="25" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="17" y="31" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#38bdf8">FC</text>

      <text x="65" y="31" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#64748b">VS</text>

      <circle cx="115" cy="25" r="22" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
      <text x="106" y="31" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#a855f7">RM</text>

      <rect x="160" y="10" width="160" height="30" rx="6" fill="#2563eb" />
      <text x="180" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ffffff">Watch 60 FPS Feed</text>
    </g>

    <!-- Side Sidebar Items: Live EPG channels -->
    <g transform="translate(380, 0)">
      <!-- Channel 1 -->
      <rect x="0" y="0" width="200" height="60" rx="8" fill="#131e36" stroke="#1e293b" stroke-width="1" />
      <rect x="10" y="12" width="36" height="36" rx="6" fill="#2563eb" />
      <text x="18" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff">SP1</text>
      <text x="56" y="28" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ffffff">Sky Sports Main</text>
      <text x="56" y="44" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#38bdf8">Live Football 4K</text>

      <!-- Channel 2 -->
      <rect x="0" y="70" width="200" height="60" rx="8" fill="#131e36" stroke="#1e293b" stroke-width="1" />
      <rect x="10" y="82" width="36" height="36" rx="6" fill="#7c3aed" />
      <text x="16" y="105" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff">TNT</text>
      <text x="56" y="98" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ffffff">TNT Sports Ultimate</text>
      <text x="56" y="114" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#a855f7">UFC Fight Night</text>

      <!-- Channel 3 -->
      <rect x="0" y="140" width="200" height="60" rx="8" fill="#131e36" stroke="#1e293b" stroke-width="1" />
      <rect x="10" y="152" width="36" height="36" rx="6" fill="#059669" />
      <text x="16" y="175" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff">CIN</text>
      <text x="56" y="168" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ffffff">Cinema Premier 4K</text>
      <text x="56" y="184" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#34d399">Top Blockbusters</text>
    </g>
  </g>

  <!-- Bottom Player Bar Overlay -->
  <rect x="85" y="365" width="630" height="50" fill="#090d16" opacity="0.9" />
  <rect x="105" y="380" width="590" height="4" rx="2" fill="#1e293b" />
  <rect x="105" y="380" width="420" height="4" rx="2" fill="url(#glow-cyan-blue)" />
  <text x="105" y="403" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">BUFFER HEALTH: 100% (ANTI-FREEZE 9.3 ACTIVE)</text>
  <text x="635" y="403" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#38bdf8">3840x2160 @ 60fps</text>
</svg>
