<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="tv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="tv-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#tv-grad)" />
  
  <!-- TiviMate EPG Grid Mockup -->
  <g transform="translate(100, 45)">
    <rect x="0" y="0" width="400" height="140" rx="8" fill="#131d33" stroke="#2563eb" stroke-width="1.5" />
    <!-- Row 1 -->
    <rect x="10" y="10" width="70" height="32" rx="4" fill="#1e293b" />
    <text x="45" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#38bdf8">CH 01</text>
    <rect x="85" y="10" width="180" height="32" rx="4" fill="#1e3a8a" />
    <text x="95" y="30" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#ffffff">Live Premier League Match</text>
    <rect x="270" y="10" width="120" height="32" rx="4" fill="#1e293b" />
    <text x="280" y="30" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Post-Match Show</text>

    <!-- Row 2 -->
    <rect x="10" y="50" width="70" height="32" rx="4" fill="#1e293b" />
    <text x="45" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#a855f7">CH 02</text>
    <rect x="85" y="50" width="130" height="32" rx="4" fill="#1e293b" />
    <text x="95" y="70" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Morning News</text>
    <rect x="220" y="50" width="170" height="32" rx="4" fill="#4c1d95" />
    <text x="230" y="70" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#ffffff">4K Action Blockbuster</text>

    <!-- Row 3 -->
    <rect x="10" y="90" width="70" height="32" rx="4" fill="#1e293b" />
    <text x="45" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#34d399">CH 03</text>
    <rect x="85" y="90" width="305" height="32" rx="4" fill="#064e3b" />
    <text x="95" y="110" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#ffffff">UFC Fight Night Main Card (Live)</text>
  </g>

  <!-- Title Badge -->
  <rect x="60" y="210" width="480" height="80" rx="12" fill="#0f172a" stroke="url(#tv-blue)" stroke-width="1.5" />
  <text x="300" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff">TIVIMATE PREMIUM COMPLETE GUIDE</text>
  <text x="300" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#a855f7">EPG Sync, Quad Multi-View &amp; Xtream Codes</text>
</svg>
