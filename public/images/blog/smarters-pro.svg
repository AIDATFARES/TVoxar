<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="sm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="100%" stop-color="#022c43" />
    </linearGradient>
    <linearGradient id="sm-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c0fa" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#sm-grad)" />
  
  <!-- Smarters 4 tile mockup -->
  <g transform="translate(180, 45)">
    <rect x="0" y="0" width="110" height="65" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
    <text x="55" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff">LIVE TV</text>

    <rect x="130" y="0" width="110" height="65" rx="8" fill="#831843" stroke="#f472b6" stroke-width="1.5" />
    <text x="185" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff">MOVIES</text>

    <rect x="0" y="75" width="110" height="65" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="55" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff">SERIES</text>

    <rect x="130" y="75" width="110" height="65" rx="8" fill="#701a75" stroke="#e879f9" stroke-width="1.5" />
    <text x="185" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff">CATCH UP</text>
  </g>

  <!-- Banner -->
  <rect x="60" y="210" width="480" height="80" rx="12" fill="#0f172a" stroke="url(#sm-accent)" stroke-width="1.5" />
  <text x="300" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff">IPTV SMARTERS PRO SETUP GUIDE</text>
  <text x="300" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#38bdf8">Xtream Codes API Login &amp; Best Settings</text>
