<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyan-blue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#bg1)" />
  <circle cx="500" cy="80" r="140" fill="#3b82f6" opacity="0.15" />
  
  <!-- Apps Grid Graphics -->
  <g transform="translate(60, 60)">
    <!-- App Card 1: TiviMate -->
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <circle cx="70" cy="38" r="22" fill="#2563eb" />
    <polygon points="65,28 78,38 65,48" fill="#ffffff" />
    <text x="70" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">TiviMate</text>

    <!-- App Card 2: Smarters Pro -->
    <rect x="170" y="0" width="140" height="100" rx="12" fill="#1e293b" stroke="#00e5ff" stroke-width="2" />
    <circle cx="240" cy="38" r="22" fill="#0284c7" />
    <polygon points="235,28 248,38 235,48" fill="#ffffff" />
    <text x="240" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">Smarters Pro</text>

    <!-- App Card 3: IBO Player -->
    <rect x="340" y="0" width="140" height="100" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="410" cy="38" r="22" fill="#7c3aed" />
    <polygon points="405,28 418,38 405,48" fill="#ffffff" />
    <text x="410" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">IBO Player</text>
  </g>

  <!-- Title Banner -->
  <rect x="60" y="200" width="480" height="80" rx="12" fill="#0f172a" stroke="url(#cyan-blue1)" stroke-width="1.5" />
  <text x="300" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff">BEST IPTV PLAYERS 2026</text>
  <text x="300" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#94a3b8">Tested on Firestick, Android TV &amp; Smart TVs</text>
</svg>
