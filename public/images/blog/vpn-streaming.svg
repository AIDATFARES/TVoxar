<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="vpn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#vpn-bg)" />
  
  <!-- VPN Shield & ISP lock graphic -->
  <g transform="translate(300, 105)">
    <!-- Shield -->
    <path d="M0 -60 C35 -60 70 -45 70 -15 C70 35 30 65 0 80 C-30 65 -70 35 -70 -15 C-70 -45 -35 -60 0 -60 Z" fill="#131d33" stroke="url(#shield-grad)" stroke-width="4" />
    <!-- Lock inside -->
    <rect x="-18" y="-5" width="36" height="30" rx="6" fill="#38bdf8" />
    <path d="M-10 -5 L-10 -18 C-10 -24 10 -24 10 -18 L10 -5" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="8" r="3.5" fill="#0b132b" />
  </g>

  <!-- Banner -->
  <rect x="60" y="215" width="480" height="75" rx="12" fill="#0f172a" stroke="url(#shield-grad)" stroke-width="1.5" />
  <text x="300" y="247" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff">BEST VPNS FOR IPTV STREAMING</text>
  <text x="300" y="273" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#34d399">Bypass ISP Throttling &amp; Protect Your Privacy</text>
</svg>
