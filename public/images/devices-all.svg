<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="dev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="20" fill="url(#dev-bg)" stroke="#1e293b" stroke-width="2" />

  <!-- Smart TV in center -->
  <g transform="translate(190, 40)">
    <rect x="0" y="0" width="320" height="190" rx="10" fill="#030712" stroke="#3b82f6" stroke-width="3" />
    <rect x="15" y="15" width="290" height="160" rx="6" fill="#131d33" />
    <!-- TV Content -->
    <circle cx="160" cy="85" r="26" fill="url(#accent-glow)" />
    <polygon points="155,75 170,85 155,95" fill="#ffffff" />
    <text x="160" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff">TVOXAR 4K LIVE</text>
    <!-- TV Stand -->
    <rect x="135" y="190" width="50" height="18" fill="#1f2937" />
    <rect x="100" y="208" width="120" height="8" rx="4" fill="#374151" />
  </g>

  <!-- Laptop on left -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="160" height="110" rx="6" fill="#030712" stroke="#475569" stroke-width="2" />
    <rect x="8" y="8" width="144" height="94" rx="4" fill="#1e293b" />
    <polygon points="10,110 150,110 165,125 -5,125" fill="#334155" />
    <text x="80" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#38bdf8">PC &amp; MAC</text>
  </g>

  <!-- Tablet & Smartphone on right -->
  <g transform="translate(510, 85)">
    <!-- Tablet -->
    <rect x="0" y="0" width="105" height="145" rx="8" fill="#030712" stroke="#475569" stroke-width="2" />
    <rect x="6" y="6" width="93" height="133" rx="4" fill="#1e293b" />
    <text x="52" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#a855f7">TABLET</text>
  </g>

  <g transform="translate(605, 125)">
    <!-- Smartphone -->
    <rect x="0" y="0" width="55" height="105" rx="8" fill="#030712" stroke="#3b82f6" stroke-width="2" />
    <rect x="4" y="4" width="47" height="97" rx="4" fill="#0f172a" />
    <text x="27" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="8" fill="#38bdf8">MOBILE</text>
  </g>

  <!-- Firestick on bottom left -->
  <g transform="translate(180, 275)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="#1f2937" stroke="#f97316" stroke-width="1.5" />
    <text x="40" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#f97316">FIRESTICK</text>
  </g>

  <!-- Apple TV on bottom right -->
  <g transform="translate(440, 275)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="#1f2937" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="40" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#ffffff">APPLE TV</text>
  </g>
</svg>
